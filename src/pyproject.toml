[project]
name = "label-inspector"
version = "0.1.0"
description = "Print-defect inspection for barcode labels (OpenCV + CNN + ADK)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pillow",
    "pyzbar",
    "pytesseract",
    "torch",
    "torchvision",
    "google-adk",
    "google-genai",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
    "python-multipart",
    "segno",
    "python-barcode",
    "pystrich",
    "roboflow",
]

[dependency-groups]
dev = ["pytest", "httpx"]

# --- uv configuration --------------------------------------------------------
[tool.uv]
package = false                     # do not package the project itself (it is an application)

# torch/torchvision as CPU-only builds (lightweight, no CUDA)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
