<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Label Inspector">
  <title>Label Inspector</title>
  <style>
    .badge { fill: #18181b; }
    .mark  { fill: #fafafa; }
    .lens  { fill: none; stroke: #fafafa; stroke-width: 3.4; }
    @media (prefers-color-scheme: dark) {
      .badge { fill: #fafafa; }
      .mark  { fill: #18181b; }
      .lens  { stroke: #18181b; }
    }
  </style>
  <circle class="badge" cx="32" cy="32" r="32"/>
  <!-- barcode bars -->
  <g class="mark">
    <rect x="16.5" y="18" width="3.2" height="20" rx="1.2"/>
    <rect x="21.8" y="18" width="1.8" height="20" rx="0.9"/>
    <rect x="25.6" y="18" width="2.8" height="20" rx="1.2"/>
    <rect x="30.4" y="18" width="1.8" height="20" rx="0.9"/>
    <rect x="34.1" y="18" width="3.2" height="20" rx="1.2"/>
  </g>
  <!-- magnifier (inspection) -->
  <g class="lens" stroke-linecap="round">
    <circle cx="40.5" cy="41" r="7.6"/>
    <line x1="46.2" y1="46.6" x2="51.5" y2="51.9"/>
  </g>
</svg>
